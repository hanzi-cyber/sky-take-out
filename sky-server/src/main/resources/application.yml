server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
      test-while-idle: true           # 空闲时检测连接有效性
      test-on-borrow: false           # 获取连接时不检测(交给 test-while-idle 处理,提升性能)
      test-on-return: false           # 归还连接时不检测
      validation-query: SELECT 1      # 连接测试SQL
      validation-query-timeout: 1     # 连接测试超时时间(秒)
      time-between-eviction-runs-millis: 30000  # 检测间隔时间(毫秒),30秒一次
      min-evictable-idle-time-millis: 60000      # 连接最小空闲时间(毫秒),60秒
      keep-alive: true                # 开启保活,主动维持空闲连接,避免被MySQL/网络设备断开
      phy-timeout-millis: 300000      # 物理连接超时时间(毫秒),5分钟强制回收重建
      max-wait: 60000
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 86400000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    user-secret-key: itheima
    user-ttl: 86400000
    user-token-name: authentication

  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}